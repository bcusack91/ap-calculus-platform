<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="anodeSoln" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cathodeSoln" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="saltBridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#581c87">Zinc–Copper Galvanic Cell (Daniell Cell)</text>

  <!-- ===== BEAKERS ===== -->
  <!-- Anode beaker -->
  <rect x="80" y="220" width="220" height="200" rx="10" fill="url(#anodeSoln)" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="80" y="210" width="220" height="20" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

  <!-- Cathode beaker -->
  <rect x="500" y="220" width="220" height="200" rx="10" fill="url(#cathodeSoln)" stroke="#10b981" stroke-width="2.5"/>
  <rect x="500" y="210" width="220" height="20" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>

  <!-- ===== ELECTRODES ===== -->
  <!-- Zn electrode (anode) -->
  <rect x="170" y="150" width="24" height="220" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <text x="130" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Zn electrode</text>

  <!-- Cu electrode (cathode) -->
  <rect x="590" y="150" width="24" height="220" rx="3" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="668" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Cu electrode</text>

  <!-- ===== WIRE ===== -->
  <path d="M 194 150 L 194 80 L 602 80 L 602 150" fill="none" stroke="url(#wireGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Electron flow arrows (split around voltmeter) -->
  <line x1="240" y1="80" x2="365" y2="80" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <line x1="432" y1="80" x2="560" y2="80" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  <text x="300" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">e⁻ flow</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">e⁻ flow</text>

  <!-- ===== VOLTMETER ===== -->
  <circle cx="398" cy="80" r="22" fill="white" stroke="#6b7280" stroke-width="2.5"/>
  <text x="398" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">V</text>
  <text x="398" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">+1.10 V</text>

  <!-- ===== SALT BRIDGE ===== -->
  <path d="M 280 230 Q 280 180, 400 180 Q 520 180, 520 230" fill="none" stroke="url(#saltBridgeGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 280 230 Q 280 180, 400 180 Q 520 180, 520 230" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <text x="400" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Salt Bridge (KNO₃)</text>

  <!-- Salt bridge ion flow arrows -->
  <!-- Anions toward anode (arrow points left/down toward anode) -->
  <line x1="370" y1="192" x2="305" y2="212" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">NO₃⁻</text>

  <!-- Cations toward cathode (arrow points right/down toward cathode) -->
  <line x1="430" y1="192" x2="495" y2="212" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="480" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">K⁺</text>

  <!-- ===== SOLUTION LABELS ===== -->
  <text x="190" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">ZnSO₄(aq)</text>
  <text x="610" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">CuSO₄(aq)</text>

  <!-- Ions in solution -->
  <text x="140" y="300" font-size="13" fill="#1e40af" opacity="0.7">Zn²⁺</text>
  <text x="220" y="320" font-size="13" fill="#1e40af" opacity="0.7">Zn²⁺</text>
  <text x="110" y="270" font-size="14" fill="#1e40af" font-weight="600" opacity="0.85">SO₄²⁻</text>
  <text x="540" y="290" font-size="13" fill="#065f46" opacity="0.7">Cu²⁺</text>
  <text x="630" y="310" font-size="13" fill="#065f46" opacity="0.7">Cu²⁺</text>
  <text x="680" y="270" font-size="14" fill="#065f46" font-weight="600" opacity="0.85">SO₄²⁻</text>

  <!-- ===== HALF-REACTION LABELS ===== -->
  <!-- Anode box -->
  <rect x="60" y="440" width="260" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">ANODE (−) Oxidation</text>
  <text x="190" y="484" text-anchor="middle" font-size="13" fill="#1e3a5f">Zn(s) → Zn²⁺(aq) + 2e⁻</text>

  <!-- Cathode box -->
  <rect x="480" y="440" width="260" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="610" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">CATHODE (+) Reduction</text>
  <text x="610" y="484" text-anchor="middle" font-size="13" fill="#064e3b">Cu²⁺(aq) + 2e⁻ → Cu(s)</text>

  <!-- ===== SIGN LABELS ON ELECTRODES ===== -->
  <circle cx="182" cy="385" r="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="182" y="390" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">−</text>

  <circle cx="602" cy="385" r="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="602" y="390" text-anchor="middle" font-size="16" font-weight="800" fill="#065f46">+</text>
</svg>