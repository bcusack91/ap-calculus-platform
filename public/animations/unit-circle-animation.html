<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Unit Circle Animation</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .angle-0 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 2s; opacity: 0; }
        .angle-30 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 2.8s; opacity: 0; }
        .angle-45 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 3.6s; opacity: 0; }
        .angle-60 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 4.4s; opacity: 0; }
        .angle-90 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 5.2s; opacity: 0; }
        
        .coord-10 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 6.2s; opacity: 0; }
        .coord-01 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 6.8s; opacity: 0; }
        
        .coord-30 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 7.6s; opacity: 0; }
        .coord-45 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 8.4s; opacity: 0; }
        .coord-60 { animation: fadeIn 0.5s ease-in forwards; animation-delay: 9.2s; opacity: 0; }
    </style>
</head>
<body>
    <svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="800" height="800" fill="#f8fafc"/>
        
        <!-- Grid -->
        <g stroke="#e2e8f0" stroke-width="1">
            <line x1="0" y1="400" x2="800" y2="400"/>
            <line x1="400" y1="0" x2="400" y2="800"/>
            <circle cx="400" cy="400" r="100" fill="none" stroke="#cbd5e1" stroke-dasharray="5,5"/>
            <circle cx="400" cy="400" r="200" fill="none" stroke="#cbd5e1" stroke-dasharray="5,5"/>
        </g>
        
        <!-- Axes -->
        <line x1="50" y1="400" x2="750" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrowX)"/>
        <line x1="400" y1="750" x2="400" y2="50" stroke="#64748b" stroke-width="2" marker-end="url(#arrowY)"/>
        
        <defs>
            <marker id="arrowX" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
            </marker>
            <marker id="arrowY" markerWidth="10" markerHeight="10" refX="3" refY="1" orient="auto">
                <polygon points="0 0, 6 10, 3 0" fill="#64748b"/>
            </marker>
        </defs>
        
        <!-- Axis labels -->
        <text x="730" y="390" font-size="20" fill="#64748b" font-weight="bold">x</text>
        <text x="410" y="70" font-size="20" fill="#64748b" font-weight="bold">y</text>
        
        <!-- Unit circle -->
        <circle cx="400" cy="400" r="300" fill="none" stroke="#8b5cf6" stroke-width="4"/>
        
        <!-- Origin -->
        <circle cx="400" cy="400" r="5" fill="#64748b"/>
        <text x="410" y="420" font-size="14" fill="#64748b">(0, 0)</text>
        
        <!-- Angle points and labels -->
        <!-- 0° -->
        <g class="angle-0">
            <circle cx="700" cy="400" r="8" fill="#10b981"/>
            <text x="650" y="430" font-size="22" fill="#10b981" font-weight="bold">0°</text>
        </g>
        
        <!-- 30° -->
        <g class="angle-30">
            <circle cx="659.8" cy="250" r="8" fill="#10b981"/>
            <text x="600" y="280" font-size="22" fill="#10b981" font-weight="bold">30°</text>
        </g>
        
        <!-- 45° -->
        <g class="angle-45">
            <circle cx="612.1" cy="187.9" r="8" fill="#10b981"/>
            <text x="550" y="240" font-size="22" fill="#10b981" font-weight="bold">45°</text>
        </g>
        
        <!-- 60° -->
        <g class="angle-60">
            <circle cx="550" cy="140.2" r="8" fill="#10b981"/>
            <text x="480" y="190" font-size="22" fill="#10b981" font-weight="bold">60°</text>
        </g>
        
        <!-- 90° -->
        <g class="angle-90">
            <circle cx="400" cy="100" r="8" fill="#10b981"/>
            <text x="360" y="130" font-size="22" fill="#10b981" font-weight="bold">90°</text>
        </g>
        
        <!-- Endpoint coordinates (outside circle) -->
        <g class="coord-10">
            <text x="720" y="440" font-size="24" fill="#f59e0b" font-weight="bold">(1, 0)</text>
        </g>
        
        <g class="coord-01">
            <text x="330" y="75" font-size="24" fill="#f59e0b" font-weight="bold">(0, 1)</text>
        </g>
        
        <!-- Middle angle coordinates (outside circle, combined x,y with proper square roots) -->
        <g class="coord-30">
            <foreignObject x="685" y="215" width="150" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 22px; font-weight: bold; color: #8b5cf6;">
                    $\left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$
                </div>
            </foreignObject>
        </g>
        
        <g class="coord-45">
            <foreignObject x="640" y="145" width="180" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 22px; font-weight: bold; color: #8b5cf6;">
                    $\left(\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)$
                </div>
            </foreignObject>
        </g>
        
        <g class="coord-60">
            <foreignObject x="575" y="95" width="150" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 22px; font-weight: bold; color: #8b5cf6;">
                    $\left(\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$
                </div>
            </foreignObject>
        </g>
    </svg>
</body>
</html>
