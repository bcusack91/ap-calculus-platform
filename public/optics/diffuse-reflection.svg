<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="22" fill="#667eea" font-weight="bold" text-anchor="middle">Diffuse Reflection</text>
  <text x="300" y="55" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">Rough Surface - Parallel rays scatter</text>
  
  <!-- Rough surface with bumps -->
  <path d="M 100 250 L 120 245 L 140 255 L 160 248 L 180 252 L 200 246 L 220 254 L 240 248 L 260 253 L 280 247 L 300 252 L 320 248 L 340 254 L 360 247 L 380 252 L 400 246 L 420 253 L 440 248 L 460 254 L 480 249 L 500 250" 
        stroke="#333" stroke-width="4" fill="none"/>
  
  <!-- Rough surface shading -->
  <defs>
    <pattern id="roughSurface" patternUnits="userSpaceOnUse" width="15" height="15">
      <rect width="15" height="15" fill="#e8e8e8"/>
      <circle cx="3" cy="3" r="1" fill="#ccc"/>
      <circle cx="10" cy="8" r="1" fill="#ccc"/>
      <circle cx="6" cy="12" r="1" fill="#ccc"/>
    </pattern>
  </defs>
  <path d="M 100 250 L 120 245 L 140 255 L 160 248 L 180 252 L 200 246 L 220 254 L 240 248 L 260 253 L 280 247 L 300 252 L 320 248 L 340 254 L 360 247 L 380 252 L 400 246 L 420 253 L 440 248 L 460 254 L 480 249 L 500 250 L 500 380 L 100 380 Z" 
        fill="url(#roughSurface)"/>
  
  <!-- Label for rough surface -->
  <text x="300" y="370" font-family="Arial" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">Rough Surface 🏔️</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowDiffuseIncident" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#ff9800"/>
    </marker>
    <marker id="arrowDiffuseReflected" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- Three parallel incident rays -->
  <line x1="150" y1="80" x2="200" y2="246" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowDiffuseIncident)"/>
  <line x1="250" y1="80" x2="300" y2="252" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowDiffuseIncident)"/>
  <line x1="350" y1="80" x2="400" y2="246" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowDiffuseIncident)"/>
  
  <!-- Label for incident rays -->
  <text x="90" y="150" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">Parallel</text>
  <text x="90" y="168" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">incident</text>
  <text x="90" y="186" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">rays</text>
  
  <!-- Scattered reflected rays in different directions -->
  <line x1="200" y1="246" x2="170" y2="100" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  <line x1="200" y1="246" x2="230" y2="110" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  
  <line x1="300" y1="252" x2="280" y2="90" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  <line x1="300" y1="252" x2="350" y2="100" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  
  <line x1="400" y1="246" x2="380" y2="110" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  <line x1="400" y1="246" x2="450" y2="90" stroke="#667eea" stroke-width="3" marker-end="url(#arrowDiffuseReflected)"/>
  
  <!-- Label for reflected rays -->
  <text x="465" y="150" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">Scattered</text>
  <text x="465" y="168" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">reflected</text>
  <text x="465" y="186" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">rays</text>
  
  <!-- Result indicator -->
  <rect x="220" y="290" width="160" height="60" fill="#fdeaea" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="300" y="315" font-family="Arial" font-size="16" fill="#e74c3c" font-weight="bold" text-anchor="middle">No Clear Image</text>
  <text x="300" y="335" font-family="Arial" font-size="14" fill="#e74c3c" text-anchor="middle">Rays scatter 🌫️</text>
</svg>
