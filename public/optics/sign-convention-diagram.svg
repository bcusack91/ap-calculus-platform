<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" style="max-width: 100%; height: auto;">
  <!-- Title -->
  <text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#667eea">Sign Convention with Ray Diagram</text>
  
  <!-- Optical axis -->
  <defs>
    <marker id="axis-arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <line x1="50" y1="250" x2="650" y2="250" stroke="#333" stroke-width="2" marker-end="url(#axis-arrow-right)"/>
  <text x="350" y="235" font-size="13" fill="#64748b">Optical Axis</text>
  
  <!-- Tick marks on axis -->
  <line x1="150" y1="245" x2="150" y2="255" stroke="#333" stroke-width="1"/>
  <line x1="250" y1="245" x2="250" y2="255" stroke="#333" stroke-width="1"/>
  <line x1="350" y1="245" x2="350" y2="255" stroke="#333" stroke-width="1"/>
  <line x1="450" y1="245" x2="450" y2="255" stroke="#333" stroke-width="1"/>
  <line x1="550" y1="245" x2="550" y2="255" stroke="#333" stroke-width="1"/>
  
  <!-- Mirror/Lens (vertical line) -->
  <line x1="450" y1="150" x2="450" y2="350" stroke="#1e293b" stroke-width="8"/>
  <rect x="450" y="150" width="-25" height="200" fill="#64748b" opacity="0.3"/>
  <text x="450" y="380" font-size="14" fill="#1e293b" font-weight="bold" text-anchor="middle">Mirror/Lens</text>
  
  <!-- Object (vertical arrow on left) -->
  <defs>
    <marker id="object-arrow" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <polygon points="0 0, 10 0, 5 10" fill="#8b5cf6"/>
    </marker>
  </defs>
  <line x1="150" y1="250" x2="150" y2="150" stroke="#8b5cf6" stroke-width="5" marker-end="url(#object-arrow)"/>
  <line x1="135" y1="250" x2="165" y2="250" stroke="#8b5cf6" stroke-width="3"/>
  <text x="150" y="135" font-size="14" fill="#8b5cf6" font-weight="bold" text-anchor="middle">Object</text>
  
  <!-- Light ray from object to mirror -->
  <defs>
    <marker id="light-ray-arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>
  <line x1="150" y1="150" x2="445" y2="250" stroke="#3b82f6" stroke-width="4" marker-end="url(#light-ray-arrow)"/>
  <text x="280" y="180" font-size="14" fill="#3b82f6" font-weight="bold">Light Ray →</text>
  
  <!-- Positive direction label (right side) -->
  <rect x="490" y="200" width="150" height="80" fill="#dcfce7" stroke="#22c55e" stroke-width="3" rx="8"/>
  <text x="565" y="225" font-size="18" font-weight="bold" text-anchor="middle" fill="#22c55e">POSITIVE (+)</text>
  <text x="565" y="245" font-size="12" text-anchor="middle" fill="#166534">Direction of</text>
  <text x="565" y="260" font-size="12" text-anchor="middle" fill="#166534">light travel</text>
  
  <!-- Arrow showing positive direction -->
  <defs>
    <marker id="positive-arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>
  <line x1="500" y1="320" x2="630" y2="320" stroke="#22c55e" stroke-width="3" marker-end="url(#positive-arrow)"/>
  
  <!-- Negative direction label (left side) -->
  <rect x="60" y="200" width="150" height="80" fill="#fee2e2" stroke="#ef4444" stroke-width="3" rx="8"/>
  <text x="135" y="225" font-size="18" font-weight="bold" text-anchor="middle" fill="#ef4444">NEGATIVE (−)</text>
  <text x="135" y="245" font-size="12" text-anchor="middle" fill="#991b1b">Opposite to</text>
  <text x="135" y="260" font-size="12" text-anchor="middle" fill="#991b1b">light travel</text>
  
  <!-- Arrow showing negative direction -->
  <defs>
    <marker id="negative-arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <line x1="200" y1="320" x2="70" y2="320" stroke="#ef4444" stroke-width="3" marker-end="url(#negative-arrow)"/>
  
  <!-- Information box at bottom -->
  <rect x="100" y="420" width="500" height="60" fill="#f0f4ff" stroke="#667eea" stroke-width="2" rx="8"/>
  <text x="350" y="445" font-size="15" font-weight="bold" text-anchor="middle" fill="#667eea">Key Principle</text>
  <text x="350" y="465" font-size="13" text-anchor="middle" fill="#555">The arrow on the light ray defines the positive direction →</text>
</svg>
