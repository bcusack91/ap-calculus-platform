<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" style="max-width: 100%; height: auto;">
  <!-- Title -->
  <text x="300" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#667eea">Total Internal Reflection</text>
  
  <!-- Media labels -->
  <text x="100" y="60" font-size="16" font-weight="bold" fill="#06b6d4">Water (n = 1.33)</text>
  <text x="100" y="390" font-size="16" font-weight="bold" fill="#3b82f6">Air (n = 1.0)</text>
  
  <!-- Interface -->
  <line x1="50" y1="225" x2="550" y2="225" stroke="#1e293b" stroke-width="4"/>
  <rect x="50" y="70" width="500" height="155" fill="#06b6d4" opacity="0.2"/>
  
  <!-- Left side: Normal refraction -->
  <g>
    <text x="150" y="100" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">θ &lt; θc</text>
    
    <!-- Normal line -->
    <line x1="150" y1="120" x2="150" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Incident ray from water -->
    <defs>
      <marker id="arrow-normal-inc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
      </marker>
    </defs>
    <line x1="150" y1="180" x2="150" y2="225" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-normal-inc)"/>
    
    <!-- Refracted ray into air -->
    <defs>
      <marker id="arrow-normal-ref" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
      </marker>
    </defs>
    <line x1="150" y1="225" x2="200" y2="300" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-normal-ref)"/>
    
    <!-- Label -->
    <text x="150" y="420" font-size="12" fill="#555" text-anchor="middle">Refraction occurs</text>
  </g>
  
  <!-- Middle: Critical angle -->
  <g>
    <text x="300" y="100" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">θ = θc</text>
    
    <!-- Normal line -->
    <line x1="300" y1="120" x2="300" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Incident ray -->
    <defs>
      <marker id="arrow-critical-inc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
      </marker>
    </defs>
    <line x1="260" y1="160" x2="300" y2="225" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-critical-inc)"/>
    
    <!-- Refracted ray along interface -->
    <defs>
      <marker id="arrow-critical-ref" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
      </marker>
    </defs>
    <line x1="300" y1="225" x2="450" y2="225" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-critical-ref)"/>
    
    <!-- Angle label -->
    <text x="275" y="210" font-size="12" fill="#f59e0b" font-weight="bold">θc</text>
    
    <!-- Label -->
    <text x="300" y="420" font-size="12" fill="#555" text-anchor="middle">Critical angle</text>
  </g>
  
  <!-- Right side: Total internal reflection -->
  <g>
    <text x="450" y="100" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">θ &gt; θc</text>
    
    <!-- Normal line -->
    <line x1="450" y1="120" x2="450" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Incident ray -->
    <defs>
      <marker id="arrow-tir-inc" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
      </marker>
    </defs>
    <line x1="400" y1="140" x2="450" y2="225" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-tir-inc)"/>
    
    <!-- Reflected ray back into water -->
    <defs>
      <marker id="arrow-tir-ref" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
      </marker>
    </defs>
    <line x1="450" y1="225" x2="500" y2="140" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-tir-ref)"/>
    
    <!-- Label -->
    <text x="450" y="420" font-size="12" fill="#555" text-anchor="middle">Total Internal</text>
    <text x="450" y="435" font-size="12" fill="#555" text-anchor="middle">Reflection</text>
  </g>
  
  <!-- Formula box -->
  <rect x="175" y="15" width="250" height="30" fill="#f0f4ff" stroke="#667eea" stroke-width="2" rx="8"/>
  <text x="300" y="35" font-size="15" font-weight="bold" text-anchor="middle" fill="#667eea">sin(θc) = n₂/n₁</text>
</svg>
