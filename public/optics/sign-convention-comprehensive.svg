<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background regions -->
  <rect x="0" y="0" width="400" height="500" fill="#fff3cd" opacity="0.3"/>
  <rect x="400" y="0" width="400" height="500" fill="#d1ecf1" opacity="0.3"/>
  
  <!-- Mirror/Lens -->
  <rect x="395" y="0" width="10" height="500" fill="#a8dadc"/>
  
  <!-- Axis -->
  <line x1="50" y1="250" x2="750" y2="250" stroke="#333" stroke-width="2"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Region labels -->
  <text x="200" y="40" font-size="24" font-weight="bold" fill="#856404" text-anchor="middle">NEGATIVE (−)</text>
  <text x="600" y="40" font-size="24" font-weight="bold" fill="#0c5460" text-anchor="middle">POSITIVE (+)</text>
  
  <text x="200" y="480" font-size="18" fill="#856404" text-anchor="middle">Virtual Images Here</text>
  <text x="600" y="480" font-size="18" fill="#0c5460" text-anchor="middle">Real Images Here</text>
  
  <!-- Mirror label -->
  <text x="400" y="130" font-size="16" font-weight="bold" fill="#333" text-anchor="middle" transform="rotate(-90 400 130)">Mirror/Lens</text>
  
  <!-- Object (left side) -->
  <rect x="190" y="200" width="20" height="50" fill="#ff6b6b"/>
  <circle cx="200" cy="195" r="8" fill="#ffd93d"/>
  <text x="200" y="280" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Object</text>
  <text x="200" y="300" font-size="14" fill="#333" text-anchor="middle">d₀ = -200 cm</text>
  
  <!-- Light ray from object to mirror -->
  <line x1="210" y1="225" x2="395" y2="225" stroke="#ff6b6b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="300" y="215" font-size="14" font-weight="bold" fill="#ff6b6b" text-anchor="middle">Light Direction →</text>
  <text x="300" y="205" font-size="12" fill="#ff6b6b" text-anchor="middle">(DEFINES POSITIVE)</text>
  
  <!-- Real image (right side) -->
  <rect x="590" y="200" width="20" height="50" fill="#4ecdc4"/>
  <circle cx="600" cy="195" r="8" fill="#4ecdc4"/>
  <text x="600" y="280" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Real Image</text>
  <text x="600" y="300" font-size="14" fill="#333" text-anchor="middle">dᵢ = +200 cm</text>
  
  <!-- Converging rays to real image -->
  <line x1="405" y1="215" x2="590" y2="215" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="405" y1="235" x2="590" y2="235" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Virtual image (left side, dashed) -->
  <rect x="190" y="340" width="20" height="50" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="200" cy="335" r="8" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="200" y="420" font-size="16" font-weight="bold" fill="#95a5a6" text-anchor="middle">Virtual Image</text>
  <text x="200" y="440" font-size="14" fill="#95a5a6" text-anchor="middle">dᵢ = -200 cm</text>
  
  <!-- Virtual rays (dashed, going backward from mirror) -->
  <line x1="395" y1="355" x2="210" y2="355" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-gray)"/>
  <line x1="395" y1="375" x2="210" y2="375" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-gray)"/>
  <text x="300" y="345" font-size="12" fill="#95a5a6" text-anchor="middle">Appears to come from here</text>
  
  <!-- Key Points Box -->
  <rect x="20" y="70" width="360" height="100" fill="white" stroke="#667eea" stroke-width="2" rx="10"/>
  <text x="40" y="95" font-size="16" font-weight="bold" fill="#667eea">Key Points:</text>
  <text x="40" y="120" font-size="14" fill="#333">✓ Light direction DEFINES positive (→)</text>
  <text x="40" y="140" font-size="14" fill="#333">✓ Positive dᵢ = Real (light reaches there)</text>
  <text x="40" y="160" font-size="14" fill="#333">✓ Negative dᵢ = Virtual (appears from there)</text>
</svg>
