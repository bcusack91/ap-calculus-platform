<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Convention Quiz</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: #f8f9fa;
        }
        .quiz-section {
            margin-top: 30px;
        }
        .question-group {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .question-group h3 {
            margin-top: 0;
            color: #667eea;
            font-size: 18px;
        }
        .question-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }
        .question-row:last-child {
            margin-bottom: 0;
        }
        .question-label {
            font-weight: 600;
            min-width: 120px;
            color: #333;
        }
        select {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s;
        }
        select:hover {
            border-color: #667eea;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        select.correct {
            border-color: #2ecc71;
            background: #e8f8f0;
        }
        select.incorrect {
            border-color: #e74c3c;
            background: #fdeaea;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        button.success {
            background: #2ecc71;
        }
        button.success:hover:not(:disabled) {
            background: #27ae60;
        }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            display: none;
        }
        .feedback.success {
            background: #e8f8f0;
            color: #2ecc71;
            border: 2px solid #2ecc71;
            display: block;
        }
        .feedback.error {
            background: #fdeaea;
            color: #e74c3c;
            border: 2px solid #e74c3c;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Sign Convention Quiz</h1>
        <p class="subtitle">Test your understanding of the sign convention!</p>
        
        <canvas id="canvas" width="800" height="400"></canvas>
        
        <div class="quiz-section">
            <div class="question-group">
                <h3>Horizontal Directions (Left/Right)</h3>
                <div class="question-row">
                    <span class="question-label">Left side is:</span>
                    <select id="leftSelect">
                        <option value="">Select...</option>
                        <option value="positive">Positive (+)</option>
                        <option value="negative">Negative (−)</option>
                    </select>
                </div>
                <div class="question-row">
                    <span class="question-label">Right side is:</span>
                    <select id="rightSelect">
                        <option value="">Select...</option>
                        <option value="positive">Positive (+)</option>
                        <option value="negative">Negative (−)</option>
                    </select>
                </div>
            </div>

            <div class="question-group">
                <h3>Vertical Directions (Top/Bottom)</h3>
                <div class="question-row">
                    <span class="question-label">Top (above axis) is:</span>
                    <select id="topSelect">
                        <option value="">Select...</option>
                        <option value="positive">Positive (+)</option>
                        <option value="negative">Negative (−)</option>
                    </select>
                </div>
                <div class="question-row">
                    <span class="question-label">Bottom (below axis) is:</span>
                    <select id="bottomSelect">
                        <option value="">Select...</option>
                        <option value="positive">Positive (+)</option>
                        <option value="negative">Negative (−)</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="btnCheck" onclick="checkAnswers()">Check Answers</button>
                <button id="btnReset" onclick="reset()">🔄 Try Again</button>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Correct answers
        const correctAnswers = {
            left: 'negative',
            right: 'positive',
            top: 'positive',
            bottom: 'negative'
        };
        
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = 400;
            const centerY = canvas.height / 2;
            
            // Draw optical axis
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(50, centerY);
            ctx.lineTo(750, centerY);
            ctx.stroke();
            
            // Label optical axis
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Optical Axis', 400, centerY - 15);
            
            // Draw mirror (vertical line at center-right)
            const mirrorX = 600;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(mirrorX, 50);
            ctx.lineTo(mirrorX, 350);
            ctx.stroke();
            
            // Add diagonal shading to indicate mirror
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 2;
            for (let i = 0; i < 15; i++) {
                const y = 50 + i * 20;
                ctx.beginPath();
                ctx.moveTo(mirrorX, y);
                ctx.lineTo(mirrorX + 15, y + 15);
                ctx.stroke();
            }
            
            // Label mirror
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Mirror', mirrorX, 380);
            
            // Draw object (candle) on the left
            const objectX = 250;
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(objectX - 15, centerY - 60, 30, 60);
            
            // Draw flame
            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.arc(objectX, centerY - 65, 10, 0, Math.PI * 2);
            ctx.fill();
            
            // Label object
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Object', objectX, centerY + 100);
            
            // Draw light ray from object to mirror
            ctx.strokeStyle = '#ff9800';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(objectX, centerY - 65);
            ctx.lineTo(mirrorX, centerY);
            ctx.stroke();
            
            // Draw arrow on ray
            drawArrow(mirrorX, centerY, Math.atan2(centerY - (centerY - 65), mirrorX - objectX));
            
            // Draw direction labels with question marks
            ctx.fillStyle = '#666';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            
            // Left/Right labels
            ctx.fillText('?', 150, centerY + 50);
            ctx.fillText('?', 700, centerY + 50);
            
            // Top/Bottom labels
            ctx.fillText('?', centerY, 40);
            ctx.fillText('?', centerY, 390);
        }
        
        function drawArrow(x, y, angle) {
            const size = 15;
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - size * Math.cos(angle - Math.PI / 6), y - size * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x - size * Math.cos(angle + Math.PI / 6), y - size * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }
        
        function checkAnswers() {
            const leftSelect = document.getElementById('leftSelect');
            const rightSelect = document.getElementById('rightSelect');
            const topSelect = document.getElementById('topSelect');
            const bottomSelect = document.getElementById('bottomSelect');
            const feedback = document.getElementById('feedback');
            
            // Check if all questions are answered
            if (!leftSelect.value || !rightSelect.value || !topSelect.value || !bottomSelect.value) {
                feedback.className = 'feedback error';
                feedback.textContent = '⚠️ Please answer all questions before checking!';
                return;
            }
            
            // Check each answer
            const leftCorrect = leftSelect.value === correctAnswers.left;
            const rightCorrect = rightSelect.value === correctAnswers.right;
            const topCorrect = topSelect.value === correctAnswers.top;
            const bottomCorrect = bottomSelect.value === correctAnswers.bottom;
            
            // Update visual feedback on selects
            leftSelect.className = leftCorrect ? 'correct' : 'incorrect';
            rightSelect.className = rightCorrect ? 'correct' : 'incorrect';
            topSelect.className = topCorrect ? 'correct' : 'incorrect';
            bottomSelect.className = bottomCorrect ? 'correct' : 'incorrect';
            
            // Calculate score
            const correctCount = [leftCorrect, rightCorrect, topCorrect, bottomCorrect].filter(x => x).length;
            
            // Show feedback
            if (correctCount === 4) {
                feedback.className = 'feedback success';
                feedback.innerHTML = '🎉 Perfect! You understand the sign convention!<br><br><strong>Remember:</strong> Light travels from left to right → Right is positive (+)<br>Above optical axis → Positive (+)';
                document.getElementById('btnCheck').textContent = '✅ Correct!';
                document.getElementById('btnCheck').className = 'success';
                document.getElementById('btnCheck').disabled = true;
            } else {
                feedback.className = 'feedback error';
                feedback.innerHTML = `❌ ${correctCount}/4 correct. Try again!<br><br><strong>Hint:</strong> The light ray shows the positive direction →`;
            }
        }
        
        function reset() {
            // Reset all selects
            document.getElementById('leftSelect').value = '';
            document.getElementById('rightSelect').value = '';
            document.getElementById('topSelect').value = '';
            document.getElementById('bottomSelect').value = '';
            
            // Remove classes
            document.getElementById('leftSelect').className = '';
            document.getElementById('rightSelect').className = '';
            document.getElementById('topSelect').className = '';
            document.getElementById('bottomSelect').className = '';
            
            // Reset button
            document.getElementById('btnCheck').textContent = 'Check Answers';
            document.getElementById('btnCheck').className = '';
            document.getElementById('btnCheck').disabled = false;
            
            // Hide feedback
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
        }
        
        // Initial draw
        drawScene();
    </script>
</body>
</html>
