<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">
    White Light Through a Prism
  </text>
  
  <!-- Incoming white light beam -->
  <line x1="50" y1="200" x2="180" y2="200" stroke="#ffffff" stroke-width="20" opacity="0.9"/>
  <line x1="50" y1="200" x2="180" y2="200" stroke="#e0e0e0" stroke-width="3"/>
  
  <!-- White light label -->
  <text x="115" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#475569">
    White light
  </text>
  
  <!-- Arrow for incoming light -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
  </defs>
  <line x1="140" y1="190" x2="170" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Prism (equilateral triangle) -->
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <polygon points="200,120 200,280 340,200" fill="url(#prismGrad)" stroke="#0284c7" stroke-width="3"/>
  
  <!-- Prism label -->
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#0369a1">
    Prism
  </text>
  
  <!-- Refracted light rays with proper colors -->
  <!-- Red (bends least - top) -->
  <line x1="340" y1="200" x2="550" y2="145" stroke="#ef4444" stroke-width="4" opacity="0.9"/>
  <text x="560" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#dc2626">
    Red (bends least)
  </text>
  
  <!-- Orange -->
  <line x1="340" y1="200" x2="550" y2="170" stroke="#f97316" stroke-width="4" opacity="0.9"/>
  <text x="560" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ea580c">
    Orange
  </text>
  
  <!-- Yellow -->
  <line x1="340" y1="200" x2="550" y2="195" stroke="#facc15" stroke-width="4" opacity="0.9"/>
  <text x="560" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ca8a04">
    Yellow
  </text>
  
  <!-- Green -->
  <line x1="340" y1="200" x2="550" y2="220" stroke="#22c55e" stroke-width="4" opacity="0.9"/>
  <text x="560" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#16a34a">
    Green
  </text>
  
  <!-- Blue -->
  <line x1="340" y1="200" x2="550" y2="250" stroke="#3b82f6" stroke-width="4" opacity="0.9"/>
  <text x="560" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2563eb">
    Blue
  </text>
  
  <!-- Violet (bends most - bottom) -->
  <line x1="340" y1="200" x2="550" y2="280" stroke="#8b5cf6" stroke-width="4" opacity="0.9"/>
  <text x="560" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#7c3aed">
    Violet (bends most)
  </text>
  
  <!-- Info box -->
  <rect x="20" y="320" width="560" height="65" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" rx="6"/>
  <text x="300" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">
    Key Concept:
  </text>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#78350f">
    Higher frequency (shorter wavelength) → Higher n → Bends MORE
  </text>
  <text x="300" y="383" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#78350f">
    Violet has shortest wavelength (400nm) • Red has longest wavelength (700nm)
  </text>
</svg>
