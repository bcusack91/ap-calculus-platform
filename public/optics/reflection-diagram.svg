<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Surface (mirror) -->
  <line x1="50" y1="250" x2="550" y2="250" stroke="#333" stroke-width="4"/>
  
  <!-- Shading below surface to indicate mirror -->
  <defs>
    <pattern id="mirrorShading" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ddd" stroke-width="5"/>
    </pattern>
  </defs>
  <rect x="50" y="250" width="500" height="150" fill="url(#mirrorShading)"/>
  
  <!-- Normal line (perpendicular to surface) -->
  <line x1="300" y1="250" x2="300" y2="50" stroke="#2ecc71" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="310" y="70" font-family="Arial" font-size="18" fill="#2ecc71" font-weight="bold">Normal (⊥)</text>
  
  <!-- Incident ray -->
  <defs>
    <marker id="arrowIncident" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
  </defs>
  <line x1="150" y1="80" x2="300" y2="250" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowIncident)"/>
  <text x="180" y="120" font-family="Arial" font-size="16" fill="#ff9800" font-weight="bold">Incident Ray</text>
  
  <!-- Reflected ray -->
  <defs>
    <marker id="arrowReflected" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667eea"/>
    </marker>
  </defs>
  <line x1="300" y1="250" x2="450" y2="80" stroke="#667eea" stroke-width="3" marker-end="url(#arrowReflected)"/>
  <text x="380" y="120" font-family="Arial" font-size="16" fill="#667eea" font-weight="bold">Reflected Ray</text>
  
  <!-- Angle of incidence arc -->
  <path d="M 300 200 A 50 50 0 0 0 265 230" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="250" y="210" font-family="Arial" font-size="20" fill="#e74c3c" font-weight="bold">θᵢ</text>
  
  <!-- Angle of reflection arc -->
  <path d="M 335 230 A 50 50 0 0 0 300 200" fill="none" stroke="#e74c3c" stroke-width="2"/>
  <text x="340" y="210" font-family="Arial" font-size="20" fill="#e74c3c" font-weight="bold">θᵣ</text>
  
  <!-- Labels -->
  <text x="300" y="290" font-family="Arial" font-size="18" fill="#333" font-weight="bold" text-anchor="middle">Surface (Mirror)</text>
  
  <!-- Title equation -->
  <text x="300" y="30" font-family="Arial" font-size="24" fill="#667eea" font-weight="bold" text-anchor="middle">θᵢ = θᵣ</text>
  
  <!-- Coplanar indicator (subtle plane outline) -->
  <rect x="100" y="40" width="400" height="240" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <text x="480" y="60" font-family="Arial" font-size="14" fill="#999" font-style="italic">All rays in</text>
  <text x="480" y="78" font-family="Arial" font-size="14" fill="#999" font-style="italic">same plane</text>
</svg>
