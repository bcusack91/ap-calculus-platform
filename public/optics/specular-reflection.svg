<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="22" fill="#667eea" font-weight="bold" text-anchor="middle">Specular Reflection</text>
  <text x="300" y="55" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">Smooth Surface - Parallel rays stay parallel</text>
  
  <!-- Smooth surface (mirror) -->
  <line x1="100" y1="250" x2="500" y2="250" stroke="#333" stroke-width="4"/>
  
  <!-- Mirror shading -->
  <defs>
    <pattern id="smoothMirror" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e0e0e0" stroke-width="5"/>
    </pattern>
  </defs>
  <rect x="100" y="250" width="400" height="130" fill="url(#smoothMirror)"/>
  
  <!-- Label for smooth surface -->
  <text x="300" y="370" font-family="Arial" font-size="16" fill="#333" font-weight="bold" text-anchor="middle">Smooth Surface ✨</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowSpecular" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Three parallel incident rays -->
  <line x1="150" y1="80" x2="200" y2="250" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowSpecular)"/>
  <line x1="250" y1="80" x2="300" y2="250" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowSpecular)"/>
  <line x1="350" y1="80" x2="400" y2="250" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowSpecular)"/>
  
  <!-- Label for incident rays -->
  <text x="90" y="150" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">Parallel</text>
  <text x="90" y="168" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">incident</text>
  <text x="90" y="186" font-family="Arial" font-size="14" fill="#ff9800" font-weight="bold">rays</text>
  
  <!-- Three parallel reflected rays -->
  <defs>
    <marker id="arrowReflectedSpecular" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#667eea"/>
    </marker>
  </defs>
  
  <line x1="200" y1="250" x2="250" y2="80" stroke="#667eea" stroke-width="3" marker-end="url(#arrowReflectedSpecular)"/>
  <line x1="300" y1="250" x2="350" y2="80" stroke="#667eea" stroke-width="3" marker-end="url(#arrowReflectedSpecular)"/>
  <line x1="400" y1="250" x2="450" y2="80" stroke="#667eea" stroke-width="3" marker-end="url(#arrowReflectedSpecular)"/>
  
  <!-- Label for reflected rays -->
  <text x="475" y="150" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">Parallel</text>
  <text x="475" y="168" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">reflected</text>
  <text x="475" y="186" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold">rays</text>
  
  <!-- Result indicator -->
  <rect x="220" y="290" width="160" height="60" fill="#e8f8f0" stroke="#2ecc71" stroke-width="2" rx="8"/>
  <text x="300" y="315" font-family="Arial" font-size="16" fill="#2ecc71" font-weight="bold" text-anchor="middle">Clear Image</text>
  <text x="300" y="335" font-family="Arial" font-size="14" fill="#2ecc71" text-anchor="middle">Forms! 🪞</text>
</svg>
