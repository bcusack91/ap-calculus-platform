<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Rainbow Viewing Geometry: Why You See an Arc
  </text>
  
  <!-- Observer (You) at center bottom -->
  <circle cx="300" cy="350" r="20" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <circle cx="293" cy="345" r="4" fill="#1e293b"/>
  <circle cx="307" cy="345" r="4" fill="#1e293b"/>
  <path d="M 293 355 Q 300 360 307 355" stroke="#92400e" stroke-width="2" fill="none"/>
  <text x="300" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#475569">
    You
  </text>
  
  <!-- Sun behind you (below) -->
  <circle cx="300" cy="500" r="30" fill="#fef08a" opacity="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,4"/>
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef08a;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="300" cy="500" r="50" fill="url(#sunGlow)"/>
  <text x="300" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#92400e">
    ☀ Sun
  </text>
  <text x="300" y="530" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#78350f">
    (behind you)
  </text>
  
  <!-- 42° cone angle indicator -->
  <line x1="300" y1="350" x2="300" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Arc of raindrops at 42° -->
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="16%" style="stop-color:#f97316"/>
      <stop offset="33%" style="stop-color:#facc15"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="66%" style="stop-color:#3b82f6"/>
      <stop offset="83%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Rainbow arc -->
  <path d="M 100 350 A 200 200 0 0 1 500 350" fill="none" stroke="url(#rainbow)" stroke-width="30" opacity="0.8"/>
  
  <!-- Raindrops along the arc -->
  <circle cx="150" cy="250" r="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <circle cx="220" cy="180" r="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <circle cx="300" cy="150" r="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <circle cx="380" cy="180" r="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <circle cx="450" cy="250" r="8" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  
  <!-- 42° angle lines to drops -->
  <line x1="300" y1="350" x2="150" y2="250" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="300" y1="350" x2="300" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="300" y1="350" x2="450" y2="250" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- 42° angle arc indicators -->
  <path d="M 300 320 A 30 30 0 0 1 280 295" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ea580c">
    42°
  </text>
  
  <path d="M 300 320 A 30 30 0 0 0 320 295" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ea580c">
    42°
  </text>
  
  <!-- Labels -->
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#0369a1">
    Raindrops at 42° angle
  </text>
  
  <!-- Info box -->
  <rect x="20" y="60" width="240" height="110" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="140" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    Why a Circle/Arc?
  </text>
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    • Sun-You line is axis
  </text>
  <text x="30" y="118" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    • ALL drops at 42° from axis
  </text>
  <text x="30" y="136" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    • Forms a cone (3D)
  </text>
  <text x="30" y="154" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    • You see it as an arc!
  </text>
  
  <!-- Color angle info -->
  <rect x="340" y="60" width="240" height="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="460" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">
    Each Color at Different Angle:
  </text>
  <text x="350" y="100" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    Red: 42° (outer) | Violet: 39.5° (inner)
  </text>
  <text x="350" y="116" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    Orange: 41.5° | Blue: 40°
  </text>
  <text x="350" y="132" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    Yellow: 41° | Green: 40.5°
  </text>
  <text x="350" y="155" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#92400e">
    = Nested arcs = Rainbow! 🌈
  </text>
</svg>
