<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" fill="#f0f9ff"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Rainbow Formation in a Raindrop
  </text>
  
  <!-- Sun rays coming from left -->
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Incoming white light -->
  <rect x="20" y="205" width="150" height="30" fill="url(#sunGrad)" opacity="0.7"/>
  <line x1="20" y1="220" x2="170" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="95" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#475569">
    White Sunlight →
  </text>
  
  <!-- Raindrop (circle) -->
  <defs>
    <radialGradient id="dropGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#bae6fd;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:0.9" />
    </radialGradient>
  </defs>
  <circle cx="300" cy="220" r="100" fill="url(#dropGrad)" stroke="#0284c7" stroke-width="3"/>
  <text x="300" y="335" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#0369a1">
    Raindrop
  </text>
  
  <!-- Step 1: Refraction entering -->
  <line x1="170" y1="220" x2="208" y2="180" stroke="#ffffff" stroke-width="3"/>
  <circle cx="208" cy="180" r="4" fill="#fbbf24"/>
  <text x="180" y="175" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ea580c">
    ① Refract in
  </text>
  <text x="180" y="188" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    (disperses)
  </text>
  
  <!-- Step 2: Internal reflection at back -->
  <line x1="208" y1="180" x2="360" y2="260" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
  <line x1="360" y1="260" x2="310" y2="310" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
  <circle cx="360" cy="260" r="4" fill="#fbbf24"/>
  <text x="385" y="265" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">
    ② TIR
  </text>
  <text x="375" y="278" font-family="Arial, sans-serif" font-size="10" fill="#6b21a8">
    (reflect back)
  </text>
  
  <!-- Step 3: Exit with dispersion -->
  <line x1="310" y1="310" x2="258" y2="305" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="258" cy="305" r="4" fill="#fbbf24"/>
  
  <!-- Exiting dispersed rays -->
  <!-- Red -->
  <line x1="258" y1="305" x2="120" y2="360" stroke="#ef4444" stroke-width="3"/>
  <text x="105" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#dc2626">
    Red (42°)
  </text>
  
  <!-- Orange -->
  <line x1="258" y1="305" x2="130" y2="375" stroke="#f97316" stroke-width="3"/>
  
  <!-- Yellow -->
  <line x1="258" y1="305" x2="145" y2="390" stroke="#facc15" stroke-width="3"/>
  
  <!-- Green -->
  <line x1="258" y1="305" x2="160" y2="400" stroke="#22c55e" stroke-width="3"/>
  
  <!-- Blue -->
  <line x1="258" y1="305" x2="175" y2="410" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Violet -->
  <line x1="258" y1="305" x2="190" y2="418" stroke="#8b5cf6" stroke-width="3"/>
  <text x="195" y="428" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#7c3aed">
    Violet (39.5°)
  </text>
  
  <text x="140" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ea580c">
    ③ Refract out
  </text>
  <text x="130" y="358" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    (disperses again)
  </text>
  
  <!-- Eye receiving light -->
  <circle cx="100" cy="440" r="12" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <circle cx="95" cy="437" r="3" fill="#1e293b"/>
  <circle cx="105" cy="437" r="3" fill="#1e293b"/>
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">
    Your Eye
  </text>
  
  <!-- Info boxes -->
  <rect x="420" y="80" width="160" height="90" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="500" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">
    Three Steps:
  </text>
  <text x="430" y="120" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    ① Refract + disperse (in)
  </text>
  <text x="430" y="138" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    ② Total internal reflect
  </text>
  <text x="430" y="156" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">
    ③ Refract + disperse (out)
  </text>
  
  <rect x="420" y="190" width="160" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="500" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">
    Key Angles:
  </text>
  <text x="430" y="230" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    • Red exits at 42° (outer)
  </text>
  <text x="430" y="246" font-family="Arial, sans-serif" font-size="10" fill="#78350f">
    • Violet exits at 39.5° (inner)
  </text>
</svg>
