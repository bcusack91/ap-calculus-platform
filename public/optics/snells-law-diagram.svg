<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7C3AED" />
    </marker>
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background regions -->
  <rect x="0" y="0" width="600" height="250" fill="url(#airGrad)"/>
  <rect x="0" y="250" width="600" height="250" fill="url(#waterGrad)"/>
  
  <!-- Medium labels -->
  <text x="50" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0369A1">Air</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="18" fill="#0369A1">n₁ = 1.0</text>
  
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E40AF">Water</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="18" fill="#1E40AF">n₂ = 1.33</text>
  
  <!-- Interface line -->
  <line x1="0" y1="250" x2="600" y2="250" stroke="#1E293B" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Normal line (dashed) -->
  <line x1="300" y1="50" x2="300" y2="450" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="310" y="155" font-family="Arial, sans-serif" font-size="16" fill="#64748B" font-style="italic">Normal</text>
  
  <!-- Incident ray -->
  <line x1="200" y1="100" x2="300" y2="250" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="180" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED">Incident Ray</text>
  
  <!-- Refracted ray -->
  <line x1="300" y1="250" x2="360" y2="420" stroke="#DC2626" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="370" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">Refracted Ray</text>
  
  <!-- Angle θ₁ arc and label -->
  <path d="M 300 180 A 70 70 0 0 1 265 215" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="250" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7C3AED">θ₁</text>
  
  <!-- Angle θ₂ arc and label -->
  <path d="M 300 320 A 70 70 0 0 0 340 285" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="315" y="310" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626">θ₂</text>
  
  <!-- Angle values -->
  <text x="220" y="165" font-family="Arial, sans-serif" font-size="14" fill="#7C3AED">45°</text>
  <text x="350" y="295" font-family="Arial, sans-serif" font-size="14" fill="#DC2626">32°</text>
  
  <!-- Key insight box -->
  <rect x="400" y="80" width="180" height="140" rx="10" fill="white" stroke="#7C3AED" stroke-width="2" opacity="0.95"/>
  <text x="490" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">Snell's Law</text>
  
  <text x="490" y="135" font-family="Arial, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">n₁ sin θ₁ = n₂ sin θ₂</text>
  
  <line x1="410" y1="150" x2="570" y2="150" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="490" y="175" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Light bends TOWARD</text>
  <text x="490" y="195" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">normal when entering</text>
  <text x="490" y="215" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">denser medium</text>
</svg>
