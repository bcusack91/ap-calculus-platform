<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <marker id="arrowhead-example" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7C3AED" />
    </marker>
    <linearGradient id="airGrad-ex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="waterGrad-ex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Air → Water Example</text>
  
  <!-- Background regions -->
  <rect x="0" y="50" width="500" height="200" fill="url(#airGrad-ex)"/>
  <rect x="0" y="250" width="500" height="250" fill="url(#waterGrad-ex)"/>
  
  <!-- Interface line -->
  <line x1="0" y1="250" x2="500" y2="250" stroke="#1E293B" stroke-width="4"/>
  <text x="450" y="245" font-family="Arial, sans-serif" font-size="14" fill="#64748B" font-style="italic">surface</text>
  
  <!-- Normal line (dashed) -->
  <line x1="250" y1="80" x2="250" y2="470" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="260" y="170" font-family="Arial, sans-serif" font-size="14" fill="#64748B" font-style="italic">Normal ⊥</text>
  
  <!-- Incident ray -->
  <line x1="140" y1="100" x2="250" y2="250" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowhead-example)"/>
  <text x="120" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED">Incident</text>
  
  <!-- Refracted ray -->
  <line x1="250" y1="250" x2="300" y2="440" stroke="#DC2626" stroke-width="4" marker-end="url(#arrowhead-example)"/>
  <text x="310" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">Refracted</text>
  
  <!-- Angle θ₁ arc and label -->
  <path d="M 250 180 A 70 70 0 0 1 205 223" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <text x="185" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#7C3AED">θ₁</text>
  
  <!-- Angle θ₂ arc and label -->
  <path d="M 250 320 A 70 70 0 0 0 285 270" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="280" y="310" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#DC2626">θ₂</text>
  
  <!-- Medium labels with indices -->
  <text x="20" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0369A1">Air</text>
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" fill="#0369A1">n₁ = 1.0</text>
  
  <text x="20" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E40AF">Water</text>
  <text x="20" y="320" font-family="Arial, sans-serif" font-size="18" fill="#1E40AF">n₂ = 1.33</text>
  
  <!-- Given information box -->
  <rect x="320" y="70" width="160" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2" opacity="0.95"/>
  <text x="400" y="93" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E293B" text-anchor="middle">Given:</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">θ₁ = 45°</text>
  <text x="400" y="137" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">n₁ = 1.0</text>
  <text x="400" y="159" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">n₂ = 1.33</text>
  
  <!-- Answer box -->
  <rect x="320" y="360" width="160" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="3" opacity="0.95"/>
  <text x="400" y="383" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="middle">Answer:</text>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626" text-anchor="middle">θ₂ = 32.1°</text>
  <line x1="330" y1="415" x2="470" y2="415" stroke="#E2E8F0" stroke-width="1"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Bends toward</text>
  <text x="400" y="453" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">normal ✓</text>
  
  <!-- Angle values on diagram -->
  <text x="165" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED">45°</text>
  <text x="295" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">32.1°</text>
</svg>
