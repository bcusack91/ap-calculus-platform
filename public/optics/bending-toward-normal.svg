<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450">
  <defs>
    <marker id="arrowhead-toward" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7C3AED" />
    </marker>
    <linearGradient id="airGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background regions -->
  <rect x="0" y="0" width="500" height="225" fill="url(#airGradient)"/>
  <rect x="0" y="225" width="500" height="225" fill="url(#glassGradient)"/>
  
  <!-- Interface line -->
  <line x1="0" y1="225" x2="500" y2="225" stroke="#1E293B" stroke-width="3"/>
  
  <!-- Normal line (dashed) -->
  <line x1="250" y1="50" x2="250" y2="400" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Incident ray -->
  <line x1="150" y1="80" x2="250" y2="225" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrowhead-toward)"/>
  
  <!-- Refracted ray (bends TOWARD normal) -->
  <line x1="250" y1="225" x2="290" y2="380" stroke="#DC2626" stroke-width="4" marker-end="url(#arrowhead-toward)"/>
  
  <!-- Angle θ₁ arc -->
  <path d="M 250 160 A 65 65 0 0 1 215 198" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7C3AED">θ₁</text>
  <text x="170" y="160" font-family="Arial, sans-serif" font-size="15" fill="#7C3AED">50°</text>
  
  <!-- Angle θ₂ arc -->
  <path d="M 250 285 A 60 60 0 0 0 280 245" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <text x="270" y="275" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#DC2626">θ₂</text>
  <text x="295" y="260" font-family="Arial, sans-serif" font-size="15" fill="#DC2626">30°</text>
  
  <!-- Medium labels -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0369A1">Air</text>
  <text x="20" y="65" font-family="Arial, sans-serif" font-size="16" fill="#0369A1">n = 1.0 (less dense)</text>
  
  <text x="20" y="260" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E40AF">Glass</text>
  <text x="20" y="285" font-family="Arial, sans-serif" font-size="16" fill="#1E40AF">n = 1.5 (more dense)</text>
  
  <!-- Key insight box -->
  <rect x="310" y="80" width="175" height="110" rx="8" fill="white" stroke="#16A34A" stroke-width="3" opacity="0.95"/>
  <text x="397" y="108" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A34A" text-anchor="middle">BENDS TOWARD</text>
  <text x="397" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16A34A" text-anchor="middle">NORMAL ↓</text>
  <line x1="320" y1="140" x2="475" y2="140" stroke="#E2E8F0" stroke-width="1"/>
  <text x="397" y="160" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">θ₂ &lt; θ₁</text>
  <text x="397" y="180" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">30° &lt; 50°</text>
</svg>
